; Worker de la cola de TigreTeve: envíos de WhatsApp, avisos push y miniaturas.
; Copiar a /etc/supervisor/conf.d/tigreteve-worker.conf y cambiar /var/www/tigreteve por la ruta real del proyecto.
; Luego: sudo supervisorctl reread && sudo supervisorctl update
[program:tigreteve-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/tigreteve/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/tigreteve
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/tigreteve/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
